<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Savings Benefit Report</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f6f8;color:#18212a}main{max-width:1500px;margin:auto;padding:14px}h1{margin:0;font-size:24px}.sub{margin:4px 0 0;color:#6f7b86;font-size:12px}.panel{margin-top:14px;padding:14px;background:#fff;border:1px solid #dfe4e8;border-radius:12px}.panel h2{margin:0 0 4px;font-size:18px}.months{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}.month{border:1px solid #dfe4e8;border-radius:10px;overflow:hidden;background:#fff}.head{display:flex;justify-content:space-between;gap:8px;padding:9px;background:#f8fafb;border-bottom:1px solid #dfe4e8}.head strong{font-size:13px}.rate{font-size:10px;color:#6f7b86}table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px;border-bottom:1px solid #edf0f2;text-align:right}th:first-child,td:first-child{text-align:left}th{font-size:10px;color:#6f7b86;background:#fafbfc}.benefit,.remaining{background:#e8f4e2;color:#2f6526;font-weight:700}.paid{color:#b42318}.total td{background:#f7f9fa;font-weight:700}.summary{margin-top:12px}.summary table{font-size:13px}.summary td{padding:10px}.summary .totalval{font-weight:800}
@media(max-width:600px){main{padding:9px}h1{font-size:21px}.panel{padding:10px}.months{display:block}.month{margin-bottom:9px}.summary thead{display:none}.summary table,.summary tbody,.summary tr,.summary td{display:block;width:100%}.summary tr{margin-bottom:10px;border:1px solid #dfe4e8;border-radius:10px;overflow:hidden}.summary td{display:flex;justify-content:space-between;gap:12px;text-align:right!important;border-bottom:1px solid #edf0f2}.summary td:first-child{display:block;background:#f7f9fa;font-size:15px;font-weight:800;text-align:left!important}.summary td:not(:first-child)::before{content:attr(data-label);color:#6f7b86;font-size:12px;font-weight:400}.summary td:last-child{border-bottom:0;background:#f8fafb}}
</style>
</head>
<body>
<main>
<h1>Savings Benefit Report</h1>

<section class="panel">
<h2>Monthly Breakdown</h2>
<p class="sub">Only months up to the current month are shown.</p>
<div id="months" class="months"></div>
</section>

<section class="panel">
<h2>Person Summary</h2>
<p class="sub">Current savings and accumulated benefit after paid benefits.</p>
<div id="personSummary" class="summary"></div>
</section>
</main>

<script>
const people=["Person A","Person B","Person C","Person D"];
const reportData=[
["Jul 2026",1100,[200000,200000,15000,15000],[0,0,0,0]],
["Aug 2026",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Sep 2026",1100,[315000,200000,15000,15000],[0,0,0,0]],
["Oct 2026",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Nov 2026",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Dec 2026",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Jan 2027",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Feb 2027",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Mar 2027",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Apr 2027",1100,[300000,200000,15000,15000],[0,0,0,0]],
["May 2027",1100,[300000,200000,15000,15000],[0,0,0,0]],
["Jun 2027",1100,[300000,200000,15000,15000],[0,0,0,0]]
];

const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat("en-US",{maximumFractionDigits:0}).format(Math.round(n)),money=n=>fmt(n)+" BDT";
const monthNo=m=>{const[a,y]=m.split(" "),ms=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];return +y*12+ms.indexOf(a)};
const data=()=>{const n=new Date(),cur=n.getFullYear()*12+n.getMonth();return reportData.filter(r=>monthNo(r[0])<=cur)};
const benefit=(m,r,s)=>s/100000*r*(m==="Jul 2026"?.5:1);

function render(){
const d=data();
if(!d.length){$("months").innerHTML='<p class="sub">No report available yet.</p>';return}

$("months").innerHTML=d.map(([m,r,s,p])=>{
const b=s.map(v=>benefit(m,r,v)),st=s.reduce((a,b)=>a+b,0),bt=b.reduce((a,b)=>a+b,0),pt=p.reduce((a,b)=>a+b,0);
return `<div class="month">
<div class="head"><strong>${m}</strong><span class="rate"><b>${fmt(r)}</b> per 1 Lakh</span></div>
<table><thead><tr><th>Person</th><th>Savings</th><th>Benefit</th><th>Paid</th></tr></thead><tbody>
${people.map((x,i)=>`<tr><td>${x}</td><td>${fmt(s[i])}</td><td class="benefit">${fmt(b[i])}</td><td class="paid">${p[i]?fmt(p[i]):"—"}</td></tr>`).join("")}
<tr class="total"><td>Total</td><td>${fmt(st)}</td><td>${fmt(bt)}</td><td>${fmt(pt)}</td></tr>
<tr class="total"><td colspan="3">Benefit remaining</td><td class="remaining">${fmt(bt-pt)}</td></tr>
</tbody></table></div>`}).join("");

const persons=people.map((_,i)=>{
const current=d.at(-1)[2][i],earned=d.reduce((x,[m,r,s])=>x+benefit(m,r,s[i]),0),paid=d.reduce((x,m)=>x+(m[3][i]||0),0),remaining=earned-paid;
return{current,earned,paid,remaining,total:current+remaining};
});

$("personSummary").innerHTML=`<table><thead><tr><th>Person</th><th>Current savings</th><th>Benefit earned</th><th>Benefit paid</th><th>Benefit remaining</th><th>Total value</th></tr></thead><tbody>
${people.map((p,i)=>`<tr>
<td>${p}</td>
<td data-label="Current savings">${money(persons[i].current)}</td>
<td data-label="Benefit earned" class="benefit">${money(persons[i].earned)}</td>
<td data-label="Benefit paid" class="paid">${money(persons[i].paid)}</td>
<td data-label="Benefit remaining" class="remaining">${money(persons[i].remaining)}</td>
<td data-label="Total value" class="totalval">${money(persons[i].total)}</td>
</tr>`).join("")}
</tbody></table>`;
}
render();
</script>
</body>
</html>
